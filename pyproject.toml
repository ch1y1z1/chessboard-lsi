[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chessboard-lsi"
version = "1.0.0"
description = "Reference scalar diffraction: Fourier and direct least-squares wavefront reconstruction"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "scikit-image>=0.22",
    "scikit-learn>=1.3",
]

[dependency-groups]
dev = [
    "pytest>=7",
]

[tool.setuptools]
packages = ["lsi"]
