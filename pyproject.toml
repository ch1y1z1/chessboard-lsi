[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chessboard-lsi"
version = "1.0.0"
description = "Chessboard lateral-shearing interferometry: minimal reproducible experiment"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[dependency-groups]
dev = [
    "pytest>=7",
]

[tool.setuptools]
packages = ["lsi"]
